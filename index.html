<script>
/* =====================================================================
   ตั้งค่า (แก้ได้ที่นี่ที่เดียว)
   ===================================================================== */
const CONFIG = {
  // ID ของ Google Sheet (ส่วนกลางของลิงก์ .../spreadsheets/d/<ID>/edit)
  SHEET_ID: '1xHAfDb441kXN6hjWEu8GIAxjhsrxdEWParfSy-PJ0XA',
  SHEET_NAME: 'ชีต1',
  // ถ้า "เผยแพร่ไปยังเว็บ" เป็น CSV แล้ว ให้วางลิงก์ไว้ที่นี่ (เสถียรที่สุด) เช่น
  // 'https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?gid=0&single=true&output=csv'
  CSV_URL: '',

  TITLE: 'รายงานผลคุณภาพน้ำประปา',
  SUBTITLE: 'เส้นท่อจ่ายน้ำ (รายวัน)',
  FOOTER: 'ฝ่ายคุณภาพน้ำ  |  รายงานผลคุณภาพน้ำประปาเส้นท่อจ่ายน้ำ',
  LOGO: 'logo.png',          // ไฟล์โลโก้ (ถ้าไม่มีจะซ่อนเอง)
  LAST_COLUMN: 'รับน้ำจาก',  // คอลัมน์สุดท้ายของตาราง: 'รับน้ำจาก' | 'สาขา' | 'โครงการ' | 'จุดเก็บ'

  // เกณฑ์มาตรฐาน (ไม่ผ่าน = แดง)
  STD: {
    chlorineMin: 0.2, chlorineMax: 2.0,   // คลอรีนอิสระคงเหลือ 0.2 - 2.0 mg/l
    colorMax: 15,                         // สีปรากฏ ไม่เกิน 15 แพลทินัม-โคบอลต์
    turbidityMax: 1.0,                    // ความขุ่น ไม่เกิน 1.0 NTU
    phMin: 6.5, phMax: 8.5,               // ความเป็นกรด-ด่าง 6.5 - 8.5
    tdsMax: 1000,                         // สารละลายทั้งหมด ไม่เกิน 1,000 mg/l
    chlorideMax: null,                    // คลอไรด์: ใส่ตัวเลขถ้าต้องการเกณฑ์ (null = ไม่แสดงเกณฑ์)
    conductivityMax: null,                // การนำไฟฟ้า: ไม่มีเกณฑ์กำหนด (ใส่ตัวเลขได้ถ้าต้องการ)
  },
  // เกณฑ์แจ้งเตือน (ผ่านมาตรฐานแต่ควรเฝ้าระวัง = เหลือง) — ปรับตามเกณฑ์ภายในของหน่วยงาน
  // ใส่ null เพื่อปิดการแจ้งเตือนรายการนั้น
  WARN: { chlorineBelow: 0.30, turbidityAbove: null, conductivityAbove: null },
};
</script>

  .summary{display:grid;grid-template-columns:1.25fr 1fr 1fr;align-items:center;padding:16px 20px;margin-bottom:20px}

</style>
</head>

<script>
/* ===================== ยูทิลิตี ===================== */
const $ = id => document.getElementById(id);
const C = { green:'#0aa64a', grey:'#d5dde6', blue:'#c6d9f1', yellow:'#fff04a', orange:'#ffb81c', red:'#e8302a', amber:'#ffb81c' };
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
const num = v => { if(v==null) return NaN; const s=String(v).replace(/,/g,'').trim(); return s===''?NaN:Number(s); };
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/** แปลงวันที่ในชีต (dd/mm/yyyy, d/m/yyyy, yyyy-mm-dd, พ.ศ. ก็ได้) เป็นคีย์ yyyy-mm-dd (ค.ศ.) */
function dateKey(s){
  s=String(s||'').trim(); if(!s) return '';
  let d,m,y, mt;
  if((mt=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){ y=+mt[1]; m=+mt[2]; d=+mt[3]; }
  else if((mt=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){ d=+mt[1]; m=+mt[2]; y=+mt[3]; if(y<100) y+=2000; }
  else return '';
  if(y>2400) y-=543;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
const thaiDate = k => { const [y,m,d]=k.split('-').map(Number); return `${d} ${TH_MONTHS[m-1]} ${y+543}`; };
const timeVal = t => { const m=String(t).match(/(\d{1,2})[:.](\d{2})/); return m? (+m[1])*60+(+m[2]) : 9999; };
const timeFmt = t => { const m=String(t).match(/(\d{1,2})[:.](\d{2})/); return m? `${m[1].padStart(2,'0')}:${m[2]}` : esc(t); };

/* ===================== โหลดข้อมูล ===================== */
const COLS = {           // ชื่อคอลัมน์ในชีต (จับคู่แบบตรงตัวก่อน แล้วค่อยแบบ "มีคำนี้")
  no:['อันดับที่','ลำดับ'], point:['จุดเก็บ'], place:['สถานที่'], road:['ถนน'], date:['วันที่เก็บ','วันที่'],
  time:['เวลา'], branch:['สาขา'], project:['โครงการ'], source:['รับน้ำจาก','รับน้ำ'],
  cl:['คลอรีนอิสระคงเหลือ','คลอรีน'], tu:['ความขุ่น'], ph:['ความเป็นกรด-ด่าง','pH'],
  ec:['การนำไฟฟ้า','ความนำไฟฟ้า'], tds:['สารละลายทั้งหมด','สารละลายรวม','TDS'], color:['สีปรากฏ','สี'], chloride:['คลอไรด์'],
};
function mapHeader(h){
  const H=h.map(x=>x.replace(/\s+/g,' ').trim()); const idx={};
  for(const [k,names] of Object.entries(COLS)){
    let i=-1;
    for(const n of names){ i=H.indexOf(n); if(i>=0) break; }
    if(i<0) for(const n of names){ i=H.findIndex(x=>x.includes(n) && !x.startsWith('รหัส')); if(i>=0) break; }
    idx[k]=i;
  }
  return idx;
}

let ALL=[];
async function fetchText(url){
  const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(r.status);
  const t=await r.text(); if(/^\s*</.test(t)) throw new Error('not csv'); return t;
}
async function loadData(){
  $('msg').textContent=''; $('dateText').textContent='กำลังโหลดข้อมูล…';
  const qs=new URLSearchParams(location.search);
  const bust='&_='+Date.now();
  const urls=[];
  if(qs.get('csv')) urls.push(qs.get('csv'));
  if(CONFIG.CSV_URL) urls.push(CONFIG.CSV_URL+(CONFIG.CSV_URL.includes('?')?'':'?')+bust);
  urls.push(`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}${bust}`);
  let text=null, err;
  for(const u of urls){ try{ text=await fetchText(u); break; }catch(e){ err=e; } }
  if(text==null){
    $('msg').textContent='โหลดข้อมูลจาก Google Sheet ไม่ได้ — ตรวจว่าแชร์ชีตเป็น "ทุกคนที่มีลิงก์ดูได้" ('+err+')';
    $('dateText').textContent='ไม่มีข้อมูล'; return;
  }
  const rows=parseCSV(text); const ix=mapHeader(rows[0]);
  const g=(r,k)=> ix[k]>=0 ? (r[ix[k]]??'').trim() : '';
  ALL=rows.slice(1).map(r=>({
    no:num(g(r,'no')), point:g(r,'point'), place:g(r,'place'), road:g(r,'road'),
    date:dateKey(g(r,'date')), time:g(r,'time'), branch:g(r,'branch'), project:g(r,'project'), source:g(r,'source'),
    cl:num(g(r,'cl')), tu:num(g(r,'tu')), ph:num(g(r,'ph')), ec:num(g(r,'ec')), tds:num(g(r,'tds')), color:num(g(r,'color')), chloride:num(g(r,'chloride')),
  })).filter(r=>r.date && (r.place || !isNaN(r.cl)));

  const dates=[...new Set(ALL.map(r=>r.date))].sort().reverse();
  const keep=$('selDate').value || qs.get('date');
  $('selDate').innerHTML=dates.map(d=>`<option value="${d}">${thaiDate(d)}</option>`).join('');
  if(keep && dates.includes(keep)) $('selDate').value=keep;
  fillBranches(); render();
}
function fillBranches(){
  const d=$('selDate').value, cur=$('selBranch').value;
  const bs=[...new Set(ALL.filter(r=>r.date===d).map(r=>r.branch).filter(Boolean))].sort();
  $('selBranch').innerHTML='<option value="">ทั้งหมด</option>'+bs.map(b=>`<option>${esc(b)}</option>`).join('');
  if(bs.includes(cur)) $('selBranch').value=cur;
}

/* ===================== ประเมินเกณฑ์ ===================== */
const S=CONFIG.STD, W=CONFIG.WARN;
const has = x => x!=null && x!=='';
const nf = v => Number(v).toLocaleString('en-US');
const lvlCl = v => isNaN(v)?'':((v<S.chlorineMin||(has(S.chlorineMax)&&v>S.chlorineMax))?'bad':(has(W.chlorineBelow)&&v<W.chlorineBelow?'warn':''));
const lvlTu = v => isNaN(v)?'':(v>S.turbidityMax?'bad':(has(W.turbidityAbove)&&v>W.turbidityAbove?'warn':''));
const lvlEc = v => isNaN(v)?'':(has(S.conductivityMax)&&v>S.conductivityMax?'bad':(has(W.conductivityAbove)&&v>W.conductivityAbove?'warn':''));
const lvlPh = v => isNaN(v)?'':((v<S.phMin||v>S.phMax)?'bad':'');
const lvlCo = v => isNaN(v)?'':(v>S.colorMax?'bad':'');
const lvlTds= v => isNaN(v)?'':(v>S.tdsMax?'bad':'');
const lvlCld= v => isNaN(v)||!has(S.chlorideMax)?'':(v>S.chlorideMax?'bad':'');
const passes = r => ![lvlCl(r.cl),lvlTu(r.tu),lvlEc(r.ec),lvlPh(r.ph),lvlCo(r.color),lvlTds(r.tds),lvlCld(r.chloride)].includes('bad');

/* ===================== วาดกราฟวงกลม (SVG) ===================== */
function pie(parts, size=128){
  const tot=parts.reduce((a,p)=>a+p.n,0), r=size/2;
  if(!tot) return `<svg width="${size}" height="${size}"><circle cx="${r}" cy="${r}" r="${r}" fill="${C.grey}"/></svg>`;
  const nz=parts.filter(p=>p.n>0);
  if(nz.length===1) return `<svg width="${size}" height="${size}"><circle cx="${r}" cy="${r}" r="${r}" fill="${nz[0].c}"/></svg>`;
  let a0=0, out='';
  for(const p of nz){
    const a1=a0+p.n/tot*2*Math.PI;
    const x0=r+r*Math.sin(a0), y0=r-r*Math.cos(a0), x1=r+r*Math.sin(a1), y1=r-r*Math.cos(a1);
    out+=`<path d="M${r} ${r} L${x0} ${y0} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1} Z" fill="${p.c}"/>`;
    a0=a1;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${out}</svg>`;
}
function legend(parts,tot){
  return parts.filter(p=>!p.hideZero||p.n>0).map(p=>
    `<div><span class="sw" style="background:${p.c}"></span>${p.label} : ${p.n} (${tot?Math.round(p.n/tot*100):0}%)</div>`).join('');
}
function status(el,ok,neutral){
  if(neutral){ el.className='status na'; el.innerHTML=neutral; return; }
  const ic=ok?`<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#0aa64a"/><path d="M11 21 l6 6 l12 -13" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
             :`<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#e5484d"/><path d="M13 13 L27 27 M27 13 L13 27" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`;
  el.className='status'+(ok?'':' bad'); el.innerHTML=ic+(ok?'เป็นไปตามเกณฑ์':'พบค่าไม่เป็นไปตามเกณฑ์');
}
const f2 = v => isNaN(v)?'-':v.toFixed(2);
const f0 = v => isNaN(v)?'-':Math.round(v).toLocaleString('en-US');

/* ===================== แสดงผล ===================== */
function render(){
  const d=$('selDate').value, b=$('selBranch').value;
  let rows=ALL.filter(r=>r.date===d && (!b||r.branch===b));
  const sort=$('selSort').value;
  rows.sort(sort==='cl' ? (a,b)=>(isNaN(a.cl)?1e9:a.cl)-(isNaN(b.cl)?1e9:b.cl)
          : sort==='time' ? (a,b)=>timeVal(a.time)-timeVal(b.time)
          : (a,b)=>(a.no||0)-(b.no||0));

  $('dateText').textContent = d ? `ประจำวันที่  ${thaiDate(d)}${b?'  ·  '+b:''}` : 'ไม่มีข้อมูล';
  const n=rows.length, np=rows.filter(passes).length, allOk=n>0&&np===n;
  $('nTotal').textContent=n; $('nPass').textContent=np;
  $('pPass').textContent=`(${n?Math.round(np/n*1000)/10:0}%)`;
  $('sumA').className='sum-a'+(allOk?'':' bad');
  $('sumText').textContent = allOk?'ได้มาตรฐาน':`ไม่ผ่าน ${n-np} ตัวอย่าง`;
  $('dropPath').setAttribute('fill', allOk?C.green:C.red);
  $('dropMark').setAttribute('d', allOk?'M30 86 l17 17 l34 -36':'M37 70 L73 104 M73 70 L37 104');

  // สเกลกราฟ (แยกจากเกณฑ์ผ่าน/ไม่ผ่าน ซึ่งใช้ CONFIG.STD)
  const bucket=(vals,defs)=>defs.map(([label,c,test])=>({label,c,n:vals.filter(test).length}));
  // คลอรีน
  const cl=rows.filter(r=>!isNaN(r.cl)).map(r=>r.cl);
  const pCl=bucket(cl,[
    ['< 0.20',C.yellow,v=>v<0.2],
    ['≥ 0.20',C.green ,v=>v>=0.2]]);
  $('pieCl').innerHTML=pie(pCl); $('legCl').innerHTML=legend(pCl,cl.length);
  status($('stCl'),!rows.some(r=>lvlCl(r.cl)==='bad'));
  // ความขุ่น
  const tu=rows.filter(r=>!isNaN(r.tu)).map(r=>r.tu);
  const pTu=bucket(tu,[
    ['0–0.5'    ,C.green ,v=>v<=0.5],
    ['> 0.5–1.0',C.blue  ,v=>v>0.5&&v<=1],
    ['> 1.0–2.0',C.yellow,v=>v>1&&v<=2],
    ['> 2.0–4.0',C.orange,v=>v>2&&v<=4],
    ['> 4.0'    ,C.red   ,v=>v>4]]);
  $('pieTu').innerHTML=pie(pTu); $('legTu').innerHTML=legend(pTu,tu.length);
  status($('stTu'),!rows.some(r=>lvlTu(r.tu)==='bad'));
  // ความนำไฟฟ้า
  const ecStd=has(S.conductivityMax), ec=rows.filter(r=>!isNaN(r.ec)).map(r=>r.ec);
  const pEc=bucket(ec,[
    ['< 400'      ,C.green ,v=>v<400],
    ['400–500'    ,C.blue  ,v=>v>=400&&v<=500],
    ['> 500–700'  ,C.yellow,v=>v>500&&v<=700],
    ['> 700–1,200',C.orange,v=>v>700&&v<=1200],
    ['> 1,200'    ,C.red   ,v=>v>1200]]);
  $('pieEc').innerHTML=pie(pEc); $('legEc').innerHTML=legend(pEc,ec.length);
  status($('stEc'),!rows.some(r=>lvlEc(r.ec)==='bad'), ecStd?null:'ไม่มีเกณฑ์มาตรฐานกำหนด');

  // ตาราง
  const lastKey={ 'รับน้ำจาก':'source','สาขา':'branch','โครงการ':'project','จุดเก็บ':'point' }[CONFIG.LAST_COLUMN]||'source';
  const cls=l=>l?` class="c-${l}"`:'';
  // คอลัมน์คลอไรด์: แสดงเฉพาะเมื่อมีค่าในข้อมูลที่กำลังแสดง
  const showCld=rows.some(r=>!isNaN(r.chloride));
  const fCld=v=>isNaN(v)?'-':String(+v.toFixed(2));
  $('tableWrap').innerHTML = n ? `<table>
    <thead><tr><th style="width:48px">ลำดับ</th><th>สถานที่</th><th style="width:${showCld?128:150}px">ถนน</th><th style="width:70px">เวลา</th>
      <th style="width:84px">คลอรีน<br>(mg/l)</th><th style="width:84px">ความขุ่น<br>(NTU)</th><th style="width:58px">pH</th><th style="width:76px">สีปรากฏ<br>(Pt-Co)</th>
      <th style="width:100px">ความนำไฟฟ้า<br>(µS/cm)</th><th style="width:100px">สารละลาย<br>ทั้งหมด<br>(mg/l)</th>${showCld?'<th style="width:72px">คลอไรด์<br>(mg/l)</th>':''}<th style="width:${showCld?96:112}px">${esc(CONFIG.LAST_COLUMN)}</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>
      <td>${i+1}</td><td class="place">${esc(r.place)}</td><td>${esc(r.road)||'-'}</td><td>${timeFmt(r.time)}</td>
      <td${cls(lvlCl(r.cl))}>${f2(r.cl)}</td><td${cls(lvlTu(r.tu))}>${f2(r.tu)}</td><td${cls(lvlPh(r.ph))}>${f2(r.ph)}</td><td${cls(lvlCo(r.color))}>${isNaN(r.color)?'-':r.color}</td>
      <td${cls(lvlEc(r.ec))}>${f0(r.ec)}</td><td${cls(lvlTds(r.tds))}>${f0(r.tds)}</td>${showCld?`<td${cls(lvlCld(r.chloride))}>${fCld(r.chloride)}</td>`:''}<td>${esc(r[lastKey])||'-'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4" class="std-h">เกณฑ์มาตรฐานคุณภาพน้ำประปา</td>
      <td>${S.chlorineMin.toFixed(1)} – ${S.chlorineMax.toFixed(1)}</td>
      <td>ไม่เกิน ${S.turbidityMax.toFixed(1)}</td>
      <td style="white-space:nowrap">${S.phMin.toFixed(1)}–${S.phMax.toFixed(1)}</td>
      <td>ไม่เกิน ${nf(S.colorMax)}</td>
      <td>${has(S.conductivityMax)?'ไม่เกิน '+nf(S.conductivityMax):'-'}</td>
      <td>ไม่เกิน ${nf(S.tdsMax)}</td>
      ${showCld?`<td>${has(S.chlorideMax)?'ไม่เกิน '+nf(S.chlorideMax):'-'}</td>`:''}
      <td></td></tr></tfoot></table>`
    : `<div class="card empty">ไม่มีข้อมูลของวันที่เลือก</div>`;
}

/* ===================== Export เป็นรูป ===================== */
async function exportImage(){
  const btn=$('btnExport'); btn.disabled=true; const old=btn.textContent; btn.textContent='กำลังสร้างรูป…';
  try{
    await document.fonts.ready;
    const el=$('report');
    const canvas=await html2canvas(el,{scale:2,useCORS:true,logging:false,backgroundColor:null,windowWidth:el.scrollWidth+40});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const name=`คุณภาพน้ำเส้นท่อ_${$('selDate').value||'report'}.png`;
    const file=new File([blob],name,{type:'image/png'});
    // มือถือ: เปิดเมนูแชร์ (เลือก LINE ได้ทันที)
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      try{ await navigator.share({files:[file],title:CONFIG.TITLE}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){ alert('สร้างรูปไม่สำเร็จ: '+e.message); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

$('selDate').onchange=()=>{ fillBranches(); render(); };
